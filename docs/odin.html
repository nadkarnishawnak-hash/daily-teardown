<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f19">
<link rel="apple-touch-icon" href="cover.png">
<title>Odin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0b0f19; color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); gap: 18px; text-align: center; }
  #orb { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #334155, #0f172a);
    box-shadow: 0 0 0 0 rgba(245,158,11,0); transition: box-shadow .4s, transform .4s; }
  #orb.idle      { box-shadow: 0 0 30px 4px rgba(148,163,184,.15); }
  #orb.playing   { box-shadow: 0 0 40px 8px rgba(59,130,246,.35); }
  #orb.listening { box-shadow: 0 0 60px 16px rgba(245,158,11,.55); transform: scale(1.06); animation: pulse 1.6s infinite; }
  #orb.speaking  { box-shadow: 0 0 60px 16px rgba(16,185,129,.55); }
  #orb.thinking  { box-shadow: 0 0 50px 12px rgba(168,85,247,.5); animation: pulse .9s infinite; }
  @keyframes pulse { 50% { transform: scale(1.1); } }
  #status { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #94a3b8; min-height: 20px; }
  #title { font-size: 24px; font-weight: 700; line-height: 1.2; max-width: 560px; }
  #meta { font-size: 14px; color: #94a3b8; }
  .progress { width: min(560px, 100%); height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: #3b82f6; transition: width .5s linear; }
  #captions { width: min(560px, 100%); min-height: 64px; font-size: 17px; line-height: 1.45; color: #cbd5e1; }
  #captions .you { color: #f59e0b; }
  #captions .odin { color: #34d399; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; font-size: 17px; font-weight: 700; padding: 14px 26px; border-radius: 999px; border: 0;
    background: #f59e0b; color: #111827; cursor: pointer; }
  button.secondary { background: #1e293b; color: #e5e7eb; }
  button:disabled { opacity: .5; }
  details { width: min(560px, 100%); font-size: 12px; color: #64748b; }
  pre { white-space: pre-wrap; word-break: break-word; text-align: left; max-height: 220px; overflow: auto;
    background: #0f172a; padding: 10px; border-radius: 8px; }
  a { color: #93c5fd; }
</style>
</head>
<body>
<main>
  <div id="orb" class="idle"></div>
  <div id="status">Loading</div>
  <div id="title"></div>
  <div id="meta"></div>
  <div class="progress"><div id="bar"></div></div>
  <div id="captions"></div>
  <div class="controls">
    <button id="start">Start</button>
    <button id="talk" class="secondary" hidden>Hey Odin</button>
    <button id="resume" class="secondary" hidden>Resume</button>
    <button id="settings" class="secondary">Settings</button>
  </div>
  <details><summary>Debug log</summary><pre id="log"></pre></details>
  <audio id="teardown" preload="auto" playsinline></audio>
  <audio id="odinAudio" autoplay playsinline></audio>
</main>

<script type="module">
// =====================================================================================
//  Odin: wake-word driven conversation layer over the daily teardown audio.
//
//  States:  init -> greeting -> playing <-> conversation -> ended
//   playing:      teardown MP3 plays; on-device wake word listens; realtime mic is muted (free).
//   conversation: MP3 paused; mic streams to the realtime model; barge-in works; tools may fire.
//   idle timeout or "continue" -> back to playing from the exact spot.
// =====================================================================================

const $ = id => document.getElementById(id);
const teardown = $("teardown"), odinAudio = $("odinAudio");
const log = (...a) => {
  const line = a.map(x => typeof x === "string" ? x : JSON.stringify(x)).join(" ");
  $("log").textContent = ($("log").textContent + line + "\n").slice(-8000);
  console.log(...a);
};
const setStatus = t => { $("status").textContent = t; };
const orb = cls => { $("orb").className = cls; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------------------------------------------------------------- settings (worker url + pin)
const store = {
  get: k => { try { return localStorage.getItem("odin." + k) || ""; } catch { return ""; } },
  set: (k, v) => { try { localStorage.setItem("odin." + k, v); } catch {} },
};
let workerUrl = store.get("workerUrl"), pin = store.get("pin");
// How you interrupt the teardown:
//   voice   - just start talking (mic stays open while it plays; best with headphones)   [no account needed]
//   phrase  - say "Hey Odin", recognized by the browser's own speech recognition       [no account needed]
//   keyword - say "Hey Odin" / "Jarvis", recognized on-device by Picovoice Porcupine   [needs PICOVOICE_ACCESS_KEY]
//   button  - press pause on your headphones / tap the button only
let wakeMode = store.get("wakeMode");
const params = new URLSearchParams(location.search);
if (params.get("wake")) { wakeMode = params.get("wake").toLowerCase(); store.set("wakeMode", wakeMode); }  // ?wake=phrase|voice|keyword|button
try {
  const r = await fetch("odin-config.json", { cache: "no-store" });
  if (r.ok) { const j = await r.json(); if (j.workerUrl && !workerUrl) workerUrl = j.workerUrl; }
} catch {}

function askSettings(force = false) {
  if (force || !workerUrl) {
    const v = prompt("Odin backend URL (from the Cloudflare Worker):", workerUrl || "https://odin.YOUR-SUBDOMAIN.workers.dev");
    if (v) { workerUrl = v.trim().replace(/\/$/, ""); store.set("workerUrl", workerUrl); }
  }
  if (force || !pin) {
    const v = prompt("Odin PIN:", "");
    if (v) { pin = v.trim(); store.set("pin", pin); }
  }
}
function askWakeMode() {
  const v = prompt("How do you want to interrupt Odin?\n\n  voice   = just start talking (recommended with headphones)\n  phrase  = say 'Hey Odin' (browser speech recognition)\n  keyword = say 'Hey Odin' via Picovoice (needs its key on the backend)\n  button  = headphone pause button / on-screen button only", wakeMode || "voice");
  if (v && ["voice", "phrase", "keyword", "button"].includes(v.trim().toLowerCase())) { wakeMode = v.trim().toLowerCase(); store.set("wakeMode", wakeMode); }
}
$("settings").onclick = () => { askSettings(true); askWakeMode(); };

async function api(path, body) {
  const r = await fetch(workerUrl + path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", "X-Odin-Pin": pin },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(`${path} ${r.status}: ${data.error || "request failed"}`);
  return data;
}

// ---------------------------------------------------------------- edition data
let edition = null, logEntries = [], config = null;

async function loadEdition() {
  const latest = await (await fetch("latest.json", { cache: "no-store" })).json();
  try { logEntries = await (await fetch("log.json", { cache: "no-store" })).json(); } catch { logEntries = []; }
  let jsonUrl = latest.json_url;
  const want = params.get("date");                  // ?date=YYYY-MM-DD replays an older edition
  if (want && want !== latest.date) {
    const hit = logEntries.find(e => e.date === want && e.page_rel);
    if (hit) jsonUrl = hit.page_rel.replace(/\.html$/, ".json");
  }
  edition = await (await fetch(jsonUrl, { cache: "no-store" })).json();
  $("title").textContent = edition.title;
  $("meta").textContent = `${edition.date} · ${edition.kind === "synthesis" ? "Sunday synthesis" : edition.archetype}` +
    (edition.duration_sec ? ` · ${Math.round(edition.duration_sec / 60)} min` : "");
  teardown.src = edition.mp3_url;
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: edition.title, artist: "The Daily Teardown", album: edition.date,
      artwork: [{ src: new URL("cover.png", location.href).href, sizes: "1400x1400", type: "image/png" }],
    });
  }
}

// ---------------------------------------------------------------- persona + tools
const TOOLS = [
  { type: "function", name: "resume_teardown",
    description: "Resume the teardown audio from where it was paused. Call this IMMEDIATELY, with no spoken reply, when the user says continue, carry on, go on, keep going, play it, resume, that's all, thanks, or otherwise signals they are done asking.",
    parameters: { type: "object", properties: {}, required: [] } },
  { type: "function", name: "restart_teardown",
    description: "Play the teardown audio from the beginning. Call with no spoken reply when the user asks to start over or hear it again from the top.",
    parameters: { type: "object", properties: {}, required: [] } },
  { type: "function", name: "queue_business",
    description: "Queue a business the user wants torn down in a future edition. Call when they say things like 'tear down X', 'do X tomorrow', 'add X to the list'.",
    parameters: { type: "object", properties: {
      name_or_url: { type: "string", description: "Company name or URL exactly as the user said it" },
      note: { type: "string", description: "Optional: why they're interested" } }, required: ["name_or_url"] } },
  { type: "function", name: "save_note",
    description: "Save a note or a source for the user; it is delivered in tomorrow morning's email. Call when they say 'remember this', 'note that', 'send me that source', 'email me the link'.",
    parameters: { type: "object", properties: {
      text: { type: "string", description: "The note, or a one-line description of the source" },
      url: { type: "string", description: "Source URL if the request is about a specific source from the teardown" } }, required: ["text"] } },
  { type: "function", name: "research",
    description: "Look something up on the live web when the answer is NOT in today's teardown data (current pricing, a competitor, a number you don't have). Say 'one moment' before calling. Returns a short spoken-style answer to relay.",
    parameters: { type: "object", properties: { question: { type: "string" } }, required: ["question"] } },
];

function compactEdition() {
  const d = { ...(edition.data || {}) };
  delete d.audio_script;
  return d;
}

function buildInstructions() {
  const name = (config && config.userName) || "sir";
  const recent = (logEntries || []).slice(-40)
    .map(e => `${e.date}: ${e.business} (${e.archetype}) - ${e.takeaway}`).join("\n");
  const quick = (edition.quick || []).map(q => `- ${q.what} (${q.source})`).join("\n");
  return `You are Odin, ${name}'s personal business analyst, speaking through headphones while they drive.

VOICE AND MANNER
Calm, deep, deliberate, dry. The voice of someone who has watched a thousand business models rise and fall and is quietly amused by most of them. Short sentences. Precise. Occasionally a flash of old-god deadpan ("Mortals keep rediscovering the razor and blades model. It keeps working."), never more than once per conversation. You address them as "${name}" occasionally, not every turn.
Never say "great question", never restate the question, never read out URLs or markdown, never list more than three things aloud.
Numbers are spoken naturally ("about four million a year", "eighty percent margins").
When asked what you think, give a real, specific opinion grounded in the numbers, and disagree when the numbers warrant it.
Keep answers to two to four sentences unless asked to go deeper. After answering, stop; do not append "anything else?".

SITUATION
The user is listening to today's edition of The Daily Teardown (a short audio breakdown of one business). When they interrupt (by saying your name, or simply by talking over it), the audio pauses and you hear them. When they are done, you call resume_teardown and the audio continues from the same spot.
- If they only said your name, acknowledge in at most two words ("Yes?", "Go ahead.") and wait. If they already asked something, just answer it.
- The conversation stays open until they end it. When they say "continue", "Odin continue", "go on", "keep going", "play it", "that's all" or "thanks", call resume_teardown immediately with no spoken reply. Never resume on your own.
- If they ask you to repeat or explain a section, do it from the data below in your own words (do not call any tool for that).
- If the answer is in today's data, use it and mention the source name in passing. If it is not, say "one moment" and call research.
- Queue requests -> queue_business, then confirm in one short sentence. "Remember this" / "send me that source" -> save_note, then confirm briefly.
- If they ask which past edition covered something, use RECENT EDITIONS.

TODAY'S EDITION (${edition.date}, ${edition.kind}):
${JSON.stringify(compactEdition())}

WHAT ELSE IS MOVING TODAY:
${quick || "(none)"}

RECENT EDITIONS:
${recent || "(none yet)"}`;
}

// ---------------------------------------------------------------- realtime session (OpenAI, WebRTC)
let pc = null, dc = null, micTrack = null, micStream = null, micSender = null;
let state = "init";
let odinSpeaking = false, userSpeaking = false, responseInFlight = false, pendingTools = 0;
let idleTimer = null, afterSpeech = null;
const IDLE_MS = 60000;      // conversation stays open; this is only a safety net if you forget to say "continue"
const GREETING_IDLE_MS = 5000;  // after the greeting, start the teardown if you say nothing

// Mic on = the track is attached and audio streams (billed). Mic off = nothing is sent at all.
async function setMic(on) {
  if (!micSender) return;
  try { await micSender.replaceTrack(on ? micTrack : null); } catch (e) { log("setMic failed", String(e)); }
}

function send(ev) { if (dc && dc.readyState === "open") dc.send(JSON.stringify(ev)); else log("dc not open; dropped", ev.type); }

async function connectRealtime() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) { throw new Error("microphone permission denied (allow the mic for this site and tap Start again)"); }
  const { value: key } = await api("/session", { instructions: buildInstructions(), tools: TOOLS, voice: config.voice });
  pc = new RTCPeerConnection();
  pc.ontrack = e => { odinAudio.srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => log("rtc", pc.connectionState);
  micTrack = micStream.getAudioTracks()[0];
  micTrack.onended = () => { log("mic track ended (another app or tab took the microphone?)"); setStatus("Mic lost: tap Start again"); };
  // Negotiate with the real track so the audio line exists, then detach it until conversation mode.
  micSender = pc.addTrack(micTrack, micStream);
  dc = pc.createDataChannel("oai-events");
  dc.onmessage = e => { try { onEvent(JSON.parse(e.data)); } catch (err) { log("bad event", String(err)); } };
  const opened = new Promise((res, rej) => { dc.onopen = res; dc.onerror = e => rej(new Error("data channel error")); });
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  const r = await fetch("https://api.openai.com/v1/realtime/calls", {
    method: "POST", body: offer.sdp,
    headers: { Authorization: `Bearer ${key}`, "Content-Type": "application/sdp" },
  });
  if (!r.ok) throw new Error(`SDP exchange failed ${r.status}: ${(await r.text()).slice(0, 200)}`);
  await pc.setRemoteDescription({ type: "answer", sdp: await r.text() });
  await Promise.race([opened, sleep(10000).then(() => { throw new Error("data channel timeout"); })]);
  await setMic(false);
  log("realtime connected");
}

function onEvent(ev) {
  switch (ev.type) {
    case "input_audio_buffer.speech_started":
      userSpeaking = true; clearIdle(); orb("listening");
      if (state === "playing" && wakeMode === "voice") enterConversation("voice");  // you just started talking over it
      break;
    case "input_audio_buffer.speech_stopped": userSpeaking = false; orb("thinking"); break;
    case "response.created": responseInFlight = true; break;
    case "output_audio_buffer.started":
      odinSpeaking = true; orb("speaking"); setStatus("Odin");
      if (state !== "playing") setMic(false);   // half-duplex: never let the mic hear Odin through the speaker
      break;
    case "output_audio_buffer.stopped":
    case "output_audio_buffer.cleared":
      odinSpeaking = false;
      if (state === "conversation") setMic(true);   // your turn again
      if (afterSpeech) { const f = afterSpeech; afterSpeech = null; f(); }
      else if (state === "conversation") { orb("listening"); setStatus("Listening"); armIdle(); }
      break;
    case "response.output_audio_transcript.done": caption("odin", ev.transcript); break;
    case "conversation.item.input_audio_transcription.completed": caption("you", ev.transcript); break;
    case "response.done":
      responseInFlight = false;
      handleToolCalls(ev.response);
      // A response with no audio (tool-only) never fires output_audio_buffer.stopped; keep the idle clock honest.
      if (state === "conversation" && !odinSpeaking && !afterSpeech) armIdle();
      break;
    case "error": log("realtime error", ev.error); break;
  }
}

function caption(who, text) {
  if (!text) return;
  const el = document.createElement("div");
  el.className = who;
  el.textContent = (who === "you" ? "You: " : "Odin: ") + text;
  const box = $("captions");
  box.appendChild(el);
  while (box.children.length > 4) box.removeChild(box.firstChild);
}

async function handleToolCalls(response) {
  for (const item of (response && response.output) || []) {
    if (item.type !== "function_call") continue;
    let args = {};
    try { args = JSON.parse(item.arguments || "{}"); } catch {}
    log("tool", item.name, args);
    let output = { ok: true }, respond = true;
    pendingTools++;
    try {
      switch (item.name) {
        case "resume_teardown":
          respond = false; output = { ok: true, resumed_at_seconds: Math.round(teardown.currentTime) };
          resumePlayback(); break;
        case "restart_teardown":
          respond = false; teardown.currentTime = 0; resumePlayback(); break;
        case "queue_business":
          output = await api("/action", { action: "queue_business", request: args.name_or_url, note: args.note || "" }); break;
        case "save_note":
          output = await api("/action", { action: "save_note", text: args.text, url: args.url || "", edition: edition.date }); break;
        case "research":
          orb("thinking"); setStatus("Researching");
          output = await api("/research", { question: args.question, context: {
            business: edition.title, archetype: edition.archetype, numbers: edition.data && edition.data.numbers,
            sources: edition.data && edition.data.sources } });
          break;
        default: output = { error: `unknown tool ${item.name}` };
      }
    } catch (e) { output = { error: String(e.message || e) }; }
    finally { pendingTools--; }
    send({ type: "conversation.item.create", item: { type: "function_call_output", call_id: item.call_id, output: JSON.stringify(output) } });
    if (respond) { responseInFlight = true; send({ type: "response.create" }); }
  }
}

function speak(instructions, then) {
  afterSpeech = then || null;
  send({ type: "response.create", response: { instructions } });
  if (then) {
    // Safety net: if no audio ever starts (rare), run the follow-up anyway.
    setTimeout(() => { if (afterSpeech === then) { afterSpeech = null; then(); } }, 6000);
  }
}

// ---------------------------------------------------------------- modes
function armIdle() { clearIdle(); idleTimer = setTimeout(idleResume, teardown.currentTime < 1 ? GREETING_IDLE_MS : IDLE_MS); }
function clearIdle() { if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; } }

function idleResume() {
  if (state !== "conversation") return;
  if (userSpeaking || odinSpeaking || responseInFlight || pendingTools > 0) { armIdle(); return; }
  if (teardown.ended || teardown.currentTime >= (teardown.duration || Infinity) - 1) { endSession(); return; }
  if (teardown.currentTime < 1) { speak("Say only: Here it is.", resumePlayback); return; }
  chime();            // no announcement: a soft cue, then the teardown just continues
  resumePlayback();
}

async function enterConversation(reason) {
  if (state === "conversation" || state === "ended") return;
  state = "conversation";
  clearIdle();
  teardown.pause();
  await wakeOff();
  await setMic(true);
  chime();
  orb("listening"); setStatus("Listening");
  $("talk").hidden = true; $("resume").hidden = false;
  if (reason === "voice") { /* the model heard you directly; it will answer on its own */ }
  else if (reason === "wake" || reason === "button") speak("The user just called your name. Reply with at most two words, e.g. 'Yes?' or 'Go ahead.'");
  else if (reason === "greeting") { /* handled by greet() */ }
  else if (reason === "ended") speak("The teardown just finished. In one short sentence, ask whether there's anything to queue or ask before you sign off.");
}

async function greet() {
  // One line from Odin, then the recording starts. No question, no waiting.
  state = "greeting";
  await setMic(false);
  orb("speaking"); setStatus("Odin");
  speak(`Say one short sentence, nothing more: greet ${config.userName}, name today's business and its archetype, and end with "say Odin any time." Then stop.`, resumePlayback);
}

async function resumePlayback() {
  if (state === "ended") return;
  clearIdle();
  afterSpeech = null;
  state = "playing";
  await setMic(wakeMode === "voice");
  orb("playing");
  setStatus(wakeMode === "voice" ? "Just start talking to interrupt" : wakeMode === "button" ? "Press pause to talk" : `Say '${wakePhrase}' to interrupt`);
  $("talk").hidden = false; $("resume").hidden = true; $("resume").textContent = "Resume";
  try { await teardown.play(); } catch (e) { log("play failed", String(e)); setStatus("Tap Play to start the recording"); $("resume").textContent = "Play"; $("resume").hidden = false; }
  await wakeOn();
}

function endSession() {
  state = "ended";
  clearIdle();
  speak("Sign off in one short sentence. Something like: That's the edition. Same time tomorrow.", () => {
    setMic(false);
    wakeOff();
    orb("idle"); setStatus("Done");
    $("talk").hidden = true; $("resume").hidden = true;
  });
}

teardown.addEventListener("timeupdate", () => {
  if (teardown.duration) $("bar").style.width = `${(teardown.currentTime / teardown.duration) * 100}%`;
});
teardown.addEventListener("ended", () => { if (state === "playing") enterConversation("ended"); });

// ---------------------------------------------------------------- wake word: four interchangeable modes
let porcupine = null, wvp = null, wakeActive = false, wakePhrase = "Hey Odin";
let recognizer = null, phraseActive = false;

function pickWakeMode() {
  if (!wakeMode || (wakeMode === "voice" && params.get("wake") !== "voice")) wakeMode = config.picovoiceKey ? "keyword" : "phrase";   // default: cue with "Odin"; "voice" only when asked for explicitly via ?wake=voice
  if (wakeMode === "keyword" && !config.picovoiceKey) { log("no PICOVOICE_ACCESS_KEY on the backend; using 'voice' mode"); wakeMode = "voice"; }
  if (wakeMode === "phrase" && !(window.SpeechRecognition || window.webkitSpeechRecognition)) {
    log("this browser has no speech recognition; using 'voice' mode"); wakeMode = "voice";
  }
  wakePhrase = wakeMode === "voice" ? "anything" : wakeMode === "button" ? "(button)" : wakeMode === "phrase" ? "Odin" : "Hey Odin";
  log("wake mode:", wakeMode);
}

async function initWake() {
  pickWakeMode();
  if (wakeMode !== "keyword") return;
  try {
    const pv = await import("https://esm.sh/@picovoice/porcupine-web@3");
    const wv = await import("https://esm.sh/@picovoice/web-voice-processor@4");
    wvp = wv.WebVoiceProcessor;
    // "Hey Odin" is a custom keyword (docs/hey_odin.ppn, trained free at console.picovoice.ai). Until that file
    // exists, fall back to Porcupine's built-in "Jarvis" so the wake word still works.
    let keywordUrl = config.keywordUrl;
    if (!keywordUrl) {
      const local = new URL("hey_odin.ppn", location.href).href;
      try { if ((await fetch(local, { method: "HEAD", cache: "no-store" })).ok) keywordUrl = local; } catch {}
    }
    wakePhrase = keywordUrl ? "Hey Odin" : "Jarvis";
    const keyword = keywordUrl
      ? { publicPath: keywordUrl, label: "hey odin", customWritePath: "hey_odin.ppn", sensitivity: 0.6 }
      : { builtin: (pv.BuiltInKeyword && pv.BuiltInKeyword.Jarvis) || "Jarvis", sensitivity: 0.6 };
    porcupine = await pv.PorcupineWorker.create(config.picovoiceKey, keyword, onWake,
      { publicPath: config.modelUrl, customWritePath: "porcupine_params.pv" });
    log("wake word ready:", wakePhrase);
    if (wakePhrase !== "Hey Odin") log("tip: add docs/hey_odin.ppn to use 'Hey Odin' (see worker/README.md)");
  } catch (e) {
    log("Picovoice failed to load:", String(e.message || e), "- switching to 'voice' mode");
    porcupine = null; wakeMode = "voice"; wakePhrase = "anything";
  }
}

function onWake(detection) { log("wake", detection && detection.label); if (state === "playing") enterConversation("wake"); }

// Browser speech recognition listening for the name (free; audio goes to the browser vendor's recognizer).
function phraseOn() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || phraseActive) return;
  recognizer = new SR();
  recognizer.continuous = true; recognizer.interimResults = true; recognizer.lang = "en-US";
  recognizer.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = (e.results[i][0].transcript || "").toLowerCase();
      if (e.results[i].isFinal) log("heard:", t.trim());
      if (/\b(hey\s+)?(odin|oden|odeon)\b/.test(t)) { log("CUE:", t.trim()); phraseOff(); if (state === "playing") enterConversation("wake"); return; }
    }
  };
  recognizer.onstart = () => log("recognizer listening");
  recognizer.onerror = e => { if (e.error !== "no-speech" && e.error !== "aborted") log("speech recognition error:", e.error); };
  recognizer.onend = () => { if (phraseActive) { try { recognizer.start(); } catch {} } };  // keep it alive
  phraseActive = true;
  try { recognizer.start(); } catch (e) { log("speech recognition start failed", String(e)); phraseActive = false; }
}
function phraseOff() { phraseActive = false; try { recognizer && recognizer.stop(); } catch {} }

async function wakeOn() {
  if (wakeMode === "keyword" && porcupine && !wakeActive) { try { await wvp.subscribe(porcupine); wakeActive = true; } catch (e) { log("wake on failed", String(e)); } }
  else if (wakeMode === "phrase") phraseOn();
  // voice mode: the realtime mic stays open (see resumePlayback); button mode: nothing to arm
}
async function wakeOff() {
  if (porcupine && wakeActive) { try { await wvp.unsubscribe(porcupine); } catch {} wakeActive = false; }
  if (phraseActive) phraseOff();
}

// ---------------------------------------------------------------- small comforts
let audioCtx = null;
function chime() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    [[660, 0], [990, 0.09]].forEach(([f, dt]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t + dt); g.gain.exponentialRampToValueAtTime(0.12, t + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.18);
      o.start(t + dt); o.stop(t + dt + 0.2);
    });
  } catch {}
}

let wakeLock = null;
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch {}
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && !wakeLock) { try { wakeLock = await navigator.wakeLock.request("screen"); } catch {} }
  });
}

if ("mediaSession" in navigator) {
  // Headphone / steering-wheel button: pause = talk to Odin, play = resume the teardown.
  navigator.mediaSession.setActionHandler("pause", () => { if (state === "playing") enterConversation("button"); });
  navigator.mediaSession.setActionHandler("play", () => { if (state === "conversation") idleResume(); });
  // Skip-forward = jump to the wrap-up ("anything to queue?"); skip-back = restart the teardown.
  navigator.mediaSession.setActionHandler("nexttrack", () => { if (state === "playing" || state === "conversation") { teardown.currentTime = Math.max(0, (teardown.duration || 0) - 0.5); resumePlayback(); } });
  navigator.mediaSession.setActionHandler("previoustrack", () => { if (state === "playing" || state === "conversation") { teardown.currentTime = 0; resumePlayback(); } });
}

// ---------------------------------------------------------------- start
$("talk").onclick = () => enterConversation("button");
$("resume").onclick = () => { clearIdle(); resumePlayback(); };

$("start").onclick = async () => {
  $("start").disabled = true;
  // Unlock audio inside the tap (iOS refuses play() that isn't traceable to a user gesture).
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  try { await teardown.play(); teardown.pause(); teardown.currentTime = 0; log("audio unlocked"); } catch (e) { log("audio unlock failed:", String(e)); }
  try {
    askSettings();
    if (!workerUrl || !pin) throw new Error("backend URL and PIN are required");
    setStatus("Connecting");
    config = await api("/config");
    await loadEdition();
    await keepAwake();
    await connectRealtime();
    await initWake();
    $("start").hidden = true;
    await greet();
  } catch (e) {
    log("start failed:", String(e.message || e));
    setStatus("Error: " + (e.message || e));
    $("start").disabled = false;
  }
};

try { await loadEdition(); setStatus("Tap start"); } catch (e) { setStatus("No edition published yet"); log(String(e)); }
</script>
</body>
</html>
